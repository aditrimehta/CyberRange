[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=student

[program:vnc]
command=/usr/bin/vncserver :1 -fg -localhost no -rfbport 5901 -geometry 1440x900 -SecurityTypes VncAuth
autorestart=true
priority=10

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 127.0.0.1:5901
autorestart=true
priority=20
