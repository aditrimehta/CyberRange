slug: firewall-hardening
title: Linux Firewall Hardening
summary: Choose a narrow inbound firewall policy using a simulated case study.
category: Defensive Security
difficulty: intermediate
estimated_minutes: 45
version: 1
objectives: ["Distinguish intended from unintended listeners", "Write a default-deny inbound policy", "Explain how to verify firewall behavior"]
questions:
  - {id: q1, type: mcq, prompt: "What is a sound starting policy for inbound traffic on a server?", points: 10, options: ["Default deny, then allow only required services", "Allow every port", "Disable connection tracking", "Trust every source address"], answer: "Default deny, then allow only required services", explanation: "A narrow allow-list reduces unnecessary exposure.", hints: ["Begin with a policy that fails closed."]}
  - {id: q2, type: short_text, prompt: "Which port must remain reachable for the lab's SSH administration?", points: 10, accepted: ["22", "tcp 22", "ssh 22"], explanation: "The target's authorized management service uses TCP 22.", hints: ["The target briefing lists the required service."]}
  - {id: q3, type: numeric, prompt: "How many TCP ports should the final policy allow from the attacker container?", points: 10, answer: 2, tolerance: 0, explanation: "Only SSH and the lab's HTTP service are intended to remain reachable.", hints: ["Compare the initial scan with the target requirements."]}
  - {id: q4, type: short_text, prompt: "In the case study, what state should the unnecessary TCP 8080 listener have after the firewall policy is applied?", points: 20, accepted: ["closed", "blocked", "unreachable"], explanation: "The unnecessary listener should not accept connections after the policy is applied.", hints: ["Only SSH and the training HTTP service are required."]}
  - {id: q5, type: flag, prompt: "Read the target's firewall status banner after the intended policy has been installed, then submit the flag.", points: 20, answer: "{{flag:firewall}}", explanation: "The target includes a session-unique status marker.", hints: ["Inspect the lab's firewall status endpoint after applying rules."]}
