slug: traffic-forensics
title: Security Log Analysis
summary: Generate real requests in a disposable environment and investigate the resulting application log.
category: Digital Forensics
difficulty: beginner
estimated_minutes: 20
version: 4
objectives: ["Search an application log", "Identify repeated failed logins", "Build a concise evidence timeline"]
questions:
  - {id: q1, type: short_text, prompt: "Which user account logged in successfully in the generated activity?", points: 10, accepted: [alex], explanation: "Check the actor field on the successful login in your session.", hints: ["Search the log for result=success."]}
  - {id: q2, type: short_text, prompt: "Which source address generated the burst of failed logins?", points: 10, accepted: [192.0.2.44], explanation: "Check the src field on failed logins in your session.", hints: ["Search for result=failed and compare src values."]}
  - {id: q3, type: numeric, prompt: "How many failed login events were generated by the training activity?", points: 10, answer: 3, tolerance: 0, explanation: "Count only the failed-login records in your session.", hints: ["Search the log for result=failed."]}
  - {id: q4, type: short_text, prompt: "What file was uploaded in your generated activity?", points: 20, accepted: [draft.zip], explanation: "Read the file field on the upload record in your session.", hints: ["Search for action=file_upload."]}
  - {id: q5, type: mcq, prompt: "What is the strongest immediate response to repeated failed logins?", points: 10, options: ["Review the source and account activity", "Delete all logs", "Disable audit logging", "Ignore the block event"], answer: "Review the source and account activity", explanation: "Correlate the source, account, and surrounding events before deciding on containment.", hints: ["Use the timestamp and source fields together."]}
