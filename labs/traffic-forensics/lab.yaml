slug: traffic-forensics
title: Security Log Analysis
summary: Search a synthetic access log to reconstruct a short account-abuse incident.
category: Digital Forensics
difficulty: beginner
estimated_minutes: 20
version: 2
objectives: ["Search an application log", "Identify repeated failed logins", "Build a concise evidence timeline"]
questions:
  - {id: q1, type: short_text, prompt: "Which user account logged in successfully at 09:01 UTC?", points: 10, accepted: [alex], explanation: "The first record shows a successful login for alex.", hints: ["Search the log for result=success."]}
  - {id: q2, type: short_text, prompt: "Which source address generated the burst of failed logins?", points: 10, accepted: [192.0.2.44], explanation: "Three failed attempts and a block event came from this reserved training address.", hints: ["Search for result=failed and compare src values."]}
  - {id: q3, type: numeric, prompt: "How many failed login events occurred before the account was blocked?", points: 10, answer: 3, tolerance: 0, explanation: "There are three failed records followed by one blocked record.", hints: ["Search the log for result=failed."]}
  - {id: q4, type: short_text, prompt: "What file did alex upload at 09:17 UTC?", points: 20, accepted: [draft.zip], explanation: "The upload record identifies draft.zip.", hints: ["Search for action=file_upload."]}
  - {id: q5, type: mcq, prompt: "What is the strongest immediate response to repeated failed logins followed by a block?", points: 10, options: ["Review the source and account activity", "Delete all logs", "Disable audit logging", "Ignore the block event"], answer: "Review the source and account activity", explanation: "Correlate the source, account, and surrounding events before deciding on containment.", hints: ["Use the timestamp and source fields together."]}
