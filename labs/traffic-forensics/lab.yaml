slug: traffic-forensics
title: Network Traffic Analysis and Forensics
summary: Inspect a deterministic packet capture for application credentials, DNS activity, and a small exfiltration pattern.
category: Digital Forensics
difficulty: beginner
estimated_minutes: 35
version: 1
objectives: ["Filter and inspect a packet capture", "Recognize cleartext protocols", "Build a concise evidence timeline"]
environment:
  attacker: {image: cyberrange/kali-desktop:1, cpu: 1.0, memory: 2g}
  targets: []
network: {internet: false}
limits: {max_duration_minutes: 90}
questions:
  - {id: q1, type: mcq, prompt: "Which protocol exposes the sample FTP login in clear text?", points: 10, options: ["FTP", "SSH", "HTTPS", "DNSSEC"], answer: "FTP", explanation: "The capture uses classic FTP, whose USER and PASS commands are not encrypted.", hints: ["Filter the capture for ftp.request.command."]}
  - {id: q2, type: short_text, prompt: "Which domain is the client's repeated DNS lookup for?", points: 10, accepted: ["updates.example.test", "updates.example.test."], explanation: "The deterministic capture contains a repeated lookup for that training domain.", hints: ["Use the DNS query name field."]}
  - {id: q3, type: numeric, prompt: "How many HTTP form submissions appear in the capture?", points: 10, answer: 1, tolerance: 0, explanation: "There is one synthetic form submission.", hints: ["Filter on http.request.method == POST."]}
  - {id: q4, type: flag, prompt: "Find the marker embedded in the small exfiltration-shaped HTTP request and submit it.", points: 20, answer: "{{flag:pcap}}", explanation: "The generator inserts a per-session marker in the synthetic capture.", hints: ["Follow the HTTP stream for the final request."]}
  - {id: q5, type: mcq, prompt: "What is the key defensive lesson from the cleartext FTP exchange?", points: 10, options: ["Credentials can be read from captured traffic", "FTP encrypts all commands by default", "DNS hides all application data", "PCAP files encrypt passwords"], answer: "Credentials can be read from captured traffic", explanation: "Use encrypted management protocols and protect capture files as sensitive evidence.", hints: ["Consider what a passive observer can see."]}
