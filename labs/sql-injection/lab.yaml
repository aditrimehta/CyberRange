slug: sql-injection
title: SQL Injection and Parameterized Queries
summary: Compare an intentionally unsafe login query with a parameterized version in a local target.
category: Application Security
difficulty: beginner
estimated_minutes: 30
version: 4
objectives: ["Observe unsafe SQL string construction", "Test the training login with controlled input", "Compare the result with a parameterized query"]
questions:
  - {id: q1, type: mcq, prompt: "What part of the training payload makes the vulnerable login condition true?", points: 10, options: ["An always-true OR condition", "The username admin", "An HTML script tag", "A file path"], answer: "An always-true OR condition", explanation: "The injected OR expression can evaluate to true while a SQL comment removes the remaining password check.", hints: ["Read the payload explanation and compare the query output."]}
  - {id: q2, type: short_text, prompt: "What defense keeps user values separate from SQL syntax?", points: 10, accepted: ["parameterized queries", "prepared statements", "parameter binding"], explanation: "Bound parameters are treated as data rather than SQL syntax.", hints: ["The safe action binds each value separately."]}
  - {id: q3, type: numeric, prompt: "How many sample accounts are listed after the vulnerable bypass?", points: 10, answer: 3, tolerance: 0, explanation: "The disposable training database contains three sample accounts.", hints: ["Inspect the matched_accounts returned by the vulnerable action."]}
  - {id: q4, type: short_text, prompt: "Which role belongs to the admin account returned by the vulnerable action?", points: 20, accepted: [administrator], explanation: "The first training account has the administrator role.", hints: ["Read the role field in the action output."]}
  - {id: q5, type: mcq, prompt: "Which change best prevents this injection in the demo?", points: 10, options: ["Use parameterized SQL", "Hide the submit button", "Base64-encode the input", "Add a longer SQL comment"], answer: "Use parameterized SQL", explanation: "Bound values prevent input from being interpreted as query syntax.", hints: ["Compare the safe action result with the vulnerable one."]}
