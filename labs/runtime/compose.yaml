services:
  target:
    build:
      context: ./target
    image: cyberrange-lab-target:local
    command: ["python", "/app/target.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    networks: [lab]
    restart: "no"

  nmap-tools:
    build:
      context: ./nmap
    image: cyberrange-nmap-tools:local
    command: ["sleep", "infinity"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.00
    pids_limit: 64
    networks: [lab]
    depends_on: [target]
    restart: "no"

networks:
  lab:
    internal: true
