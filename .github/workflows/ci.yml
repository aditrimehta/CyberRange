name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: python -m pip install --upgrade pip && python -m pip install -e 'backend[dev]'
      - run: cd backend && ruff check app tests && mypy app && pytest --cov=app --cov-report=term-missing
      - run: pip-audit -r <(python -m pip freeze)
        shell: bash
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.12.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint && npm run build && npm test && npm audit --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.12.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: docker compose up -d --build
      - run: docker compose exec -T api python /scripts/seed_dev.py
      - run: cd frontend && npm run e2e
      - if: always()
        run: docker compose down -v
